<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 483" role="img" aria-labelledby="title desc">
<title id="title">MNIST simulation accuracy comparison</title><desc id="desc">Software baseline 96.2 percent and device-aware simulation 92.7 percent, shown on a zero-to-one-hundred-percent scale.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#658099"/></marker></defs>
<rect width="1000" height="483" rx="18" fill="#f3f7fa"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="40" y="50" font-size="28" fill="#20344b" font-weight="700">From the software baseline to the device-aware model</text><text x="40" y="84" font-size="19" fill="#5c7186" font-weight="400">MNIST accuracy · summary of the values already reported on this page</text><text x="40" y="158" font-size="23" fill="#20344b" font-weight="700">Software baseline</text><rect x="40" y="174" width="810" height="36" rx="5" fill="#dfe7ee"/><rect x="40" y="174" width="779.22" height="36" rx="5" fill="#587eaa"/><text x="876" y="203" font-size="25" fill="#20344b" font-weight="700">96.2%</text><text x="40" y="271" font-size="23" fill="#20344b" font-weight="700">Device-aware simulation</text><rect x="40" y="287" width="810" height="36" rx="5" fill="#dfe7ee"/><rect x="40" y="287" width="750.87" height="36" rx="5" fill="#377e68"/><text x="876" y="316" font-size="25" fill="#20344b" font-weight="700">92.7%</text><text x="40" y="362" font-size="18" fill="#5c7186" font-weight="400">0%</text><text x="803" y="362" font-size="18" fill="#5c7186" font-weight="400">100%</text><text x="40" y="419" font-size="25" fill="#266858" font-weight="700">3.5 percentage-point difference</text><text x="40" y="452" font-size="21" fill="#20344b" font-weight="400">Model-informed simulation; not a fabricated-chip measurement.</text></g></svg>