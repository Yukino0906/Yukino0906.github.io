<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 360" role="img" aria-labelledby="title description">
  <title id="title">Verifying the local p-bit interface circuit</title>
  <desc id="description">First design and size the selection circuit and output buffer, then run transient simulations across process corners, then compare output plateaus and transition edges.</desc>
  <defs>
    <marker id="tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path fill="#638887" d="M0 0 10 5 0 10z"/></marker>
  </defs>
  <rect width="620" height="360" fill="#f1f5f5"/>
  <g stroke="#638887" stroke-width="2.5" marker-end="url(#tip)">
    <path d="M49 75v59"/><path d="M49 184v59"/>
  </g>
  <g fill="#0d605b">
    <circle cx="49" cy="57" r="9"/><circle cx="49" cy="165" r="9"/><circle cx="49" cy="273" r="9"/>
  </g>
  <g fill="#1a3747" font-family="Georgia, serif" font-size="28">
    <text x="84" y="66">Size the local circuit</text>
    <text x="84" y="174">Simulate five process corners</text>
    <text x="84" y="282">Inspect the output waveform</text>
  </g>
  <g fill="#405d68" font-family="Arial, sans-serif" font-size="20">
    <text x="84" y="98">Review signal selection and output restoration.</text>
    <text x="84" y="206">Run transient checks with each process model.</text>
    <text x="84" y="314">Compare logic levels and transition edges.</text>
  </g>
</svg>
