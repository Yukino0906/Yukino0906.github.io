<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc">
<title id="title">Immediate versus settled readback</title><desc id="desc">Conceptual timeline of a write, first read, and settled read. No experimental curve is shown.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#658099"/></marker></defs>
<rect width="1000" height="450" rx="18" fill="#f3f7fa"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="40" y="50" font-size="30" fill="#20344b" font-weight="700">What state should a write target?</text><text x="40" y="84" font-size="19" fill="#5c7186" font-weight="400">Conceptual readback sequence · no measured trace or model parameters</text><rect x="40" y="132" width="270" height="148" rx="14" fill="#ffffff" stroke="#cad6e2"/><text x="62" y="171" font-size="20" fill="#266858" font-weight="700">WRITE</text><text x="62" y="213" font-size="21" fill="#20344b" font-weight="400">Apply a programming</text><text x="62" y="243" font-size="21" fill="#20344b" font-weight="400">pulse to the device</text><rect x="365" y="132" width="270" height="148" rx="14" fill="#ffffff" stroke="#cad6e2"/><text x="387" y="171" font-size="20" fill="#266858" font-weight="700">FIRST READ</text><text x="387" y="213" font-size="21" fill="#20344b" font-weight="400">Observe the state</text><text x="387" y="243" font-size="21" fill="#20344b" font-weight="400">soon after the pulse</text><rect x="690" y="132" width="270" height="148" rx="14" fill="#ffffff" stroke="#cad6e2"/><text x="712" y="171" font-size="20" fill="#266858" font-weight="700">SETTLED READ</text><text x="712" y="213" font-size="21" fill="#20344b" font-weight="400">Evaluate the state at</text><text x="712" y="243" font-size="21" fill="#20344b" font-weight="400">the 10 s readback</text><path d="M315 204 L356 204" fill="none" stroke="#658099" stroke-width="3" marker-end="url(#arrow)"/><path d="M640 204 L681 204" fill="none" stroke="#658099" stroke-width="3" marker-end="url(#arrow)"/><rect x="40" y="312" width="920" height="105" rx="14" fill="#e5eeea" stroke="#b9d1c4"/><text x="62" y="349" font-size="22" fill="#266858" font-weight="700">Decision criterion</text><text x="62" y="385" font-size="23" fill="#20344b" font-weight="400">Assess the target tolerance after relaxation, not only at the first read.</text></g></svg>