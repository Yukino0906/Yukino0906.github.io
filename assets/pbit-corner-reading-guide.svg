<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc">
<title id="title">How to interpret the shared process-corner waveform</title><desc id="desc">Guide to comparing output levels, rising transitions, and falling transitions in the supplied local-circuit waveform. No new circuit or simulation is disclosed.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#658099"/></marker></defs>
<rect width="1000" height="480" rx="18" fill="#f3f7fa"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="40" y="50" font-size="30" fill="#20344b" font-weight="700">Reading the local-circuit corner comparison</text><text x="40" y="84" font-size="19" fill="#5c7186" font-weight="400">Interpretation guide · local-circuit transient simulation</text><rect x="40" y="123" width="172" height="65" rx="14" fill="#e5eeea" stroke="#b9d1c4"/><text x="64" y="165" font-size="25" fill="#266858" font-weight="700">Nominal</text><rect x="227" y="123" width="172" height="65" rx="14" fill="#e5eeea" stroke="#b9d1c4"/><text x="251" y="165" font-size="25" fill="#266858" font-weight="700">FF</text><rect x="414" y="123" width="172" height="65" rx="14" fill="#e5eeea" stroke="#b9d1c4"/><text x="438" y="165" font-size="25" fill="#266858" font-weight="700">SS</text><rect x="601" y="123" width="172" height="65" rx="14" fill="#e5eeea" stroke="#b9d1c4"/><text x="625" y="165" font-size="25" fill="#266858" font-weight="700">FS</text><rect x="788" y="123" width="172" height="65" rx="14" fill="#e5eeea" stroke="#b9d1c4"/><text x="812" y="165" font-size="25" fill="#266858" font-weight="700">SF</text><rect x="40" y="218" width="290" height="141" rx="14" fill="#ffffff" stroke="#cad6e2"/><text x="62" y="259" font-size="23" fill="#20344b" font-weight="700">Logic levels</text><text x="62" y="301" font-size="22" fill="#20344b" font-weight="400">Compare the low</text><text x="62" y="331" font-size="22" fill="#20344b" font-weight="400">and high plateaus.</text><rect x="355" y="218" width="290" height="141" rx="14" fill="#ffffff" stroke="#cad6e2"/><text x="377" y="259" font-size="23" fill="#20344b" font-weight="700">Rising transition</text><text x="377" y="301" font-size="22" fill="#20344b" font-weight="400">Inspect the spread</text><text x="377" y="331" font-size="22" fill="#20344b" font-weight="400">as the output rises.</text><rect x="670" y="218" width="290" height="141" rx="14" fill="#ffffff" stroke="#cad6e2"/><text x="692" y="259" font-size="23" fill="#20344b" font-weight="700">Falling transition</text><text x="692" y="301" font-size="22" fill="#20344b" font-weight="400">Inspect the spread</text><text x="692" y="331" font-size="22" fill="#20344b" font-weight="400">as the output falls.</text><text x="40" y="410" font-size="22" fill="#20344b" font-weight="400">The supplied excerpt supports a qualitative comparison across five corners.</text><text x="40" y="445" font-size="22" fill="#5c7186" font-weight="400">It does not provide a delay specification or a complete PVT assessment.</text></g></svg>