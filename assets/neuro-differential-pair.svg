<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 462" role="img" aria-labelledby="title desc">
<title id="title">Differential-pair synapse principle</title><desc id="desc">A generic differential pair encodes a signed weight using the difference of two conductances.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#658099"/></marker></defs>
<rect width="1000" height="462" rx="18" fill="#f3f7fa"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="40" y="50" font-size="29" fill="#20344b" font-weight="700">Representing a signed weight with two conductances</text><text x="40" y="84" font-size="19" fill="#5c7186" font-weight="400">Generic differential-pair principle · conceptual illustration</text><rect x="55" y="132" width="220" height="120" rx="14" fill="#ffffff" stroke="#cad6e2"/><text x="83" y="177" font-size="23" fill="#20344b" font-weight="400">Positive branch</text><text x="132" y="223" font-size="32" fill="#266858" font-weight="700">G+</text><rect x="55" y="290" width="220" height="120" rx="14" fill="#ffffff" stroke="#cad6e2"/><text x="83" y="335" font-size="23" fill="#20344b" font-weight="400">Negative branch</text><text x="132" y="381" font-size="32" fill="#266858" font-weight="700">G−</text><path d="M280 193 L354 193" fill="none" stroke="#658099" stroke-width="3"/><path d="M354 193 L354 267" fill="none" stroke="#658099" stroke-width="3"/><path d="M280 351 L354 351" fill="none" stroke="#658099" stroke-width="3"/><path d="M354 351 L354 267" fill="none" stroke="#658099" stroke-width="3"/><path d="M354 267 L416 267" fill="none" stroke="#658099" stroke-width="3" marker-end="url(#arrow)"/><rect x="430" y="193" width="505" height="153" rx="14" fill="#e5eeea" stroke="#b9d1c4"/><text x="465" y="238" font-size="24" fill="#266858" font-weight="700">Effective synaptic weight</text><text x="465" y="291" font-size="38" fill="#20344b" font-weight="400">w ∝ G+ − G−</text><text x="430" y="390" font-size="21" fill="#20344b" font-weight="400">Updates act on physical conductance states;</text><text x="430" y="422" font-size="21" fill="#20344b" font-weight="400">their nonidealities enter the weight model.</text></g></svg>